[package]
name = "qt-modes"
version = "0.1.0"
edition = "2024"
publish = false
description = "Runs one set of IPC checks under each Tauri mode (patterns, asset origins, IPC transports) on the Qt runtime"

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = ["isolation"] }

[dependencies]
tauri = { version = "3.0.0-alpha.6", features = ["isolation"] }
tauri-runtime-qt = { path = "../../crates/tauri-runtime-qt" }
serde_json = "1"
env_logger = "0.11"
