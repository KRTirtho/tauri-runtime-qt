[package]
name = "qtshim-sys"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
description = "Raw FFI bindings to qtshim, a small C++ library over Qt Widgets and QtWebEngine"
repository = "https://github.com/KRTirtho/tauri-runtime-qt"
categories = ["external-ffi-bindings", "gui"]
keywords = ["qt", "qtwebengine", "ffi"]
links = "qtshim"
build = "build.rs"
include = ["build.rs", "cpp/**", "src/**"]

[features]
default = []
# Windows hosting QWebEngineViews, profiles, custom schemes and IPC (needs QtWebEngine).
webengine = []

[build-dependencies]
cc = "1"
