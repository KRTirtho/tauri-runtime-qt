[package]
name = "tauri-runtime-qt"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "A Tauri runtime backed by Qt and QtWebEngine (Chromium) for Linux"
rust-version = "1.95"

[dependencies]
qtshim = { version = "0.1", path = "../qtshim", features = ["webengine"] }
tauri-runtime = "3.0.0-alpha.5"
tauri-utils = "3.0.0-alpha.4"
# Selecting this runtime turns on Qt menus in `tauri` (like tauri-runtime-wry enables `gtk3`).
tauri = { version = "3.0.0-alpha.6", default-features = false, features = ["qt"] }
http = "1"
url = "2"
cookie = "0.18"
raw-window-handle = "0.6"
log = "0.4"

[features]
# Enable DevTools (and the DevTools keyboard shortcut) in release builds.
devtools = ["tauri-runtime/devtools"]
