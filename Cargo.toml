[workspace]
resolver = "3"
members = [
  "crates/qtshim-sys",
  "crates/qtshim-sys/systest",
  "crates/qtshim",
  "crates/qt-test-harness",
  "crates/tauri-runtime-qt",
  "examples/qt-app",
  "examples/qt-modes",
  "examples/qt-browser",
]

# Qt menus need `tauri`'s `qt` feature and muda's Qt backend, which aren't released yet:
# build against the forks (KRTirtho/tauri on branch `qt-support`, KRTirtho/muda on `qt-backend`).
[patch.crates-io]
tauri = { git = "https://github.com/KRTirtho/tauri", branch = "qt-support" }
tauri-runtime = { git = "https://github.com/KRTirtho/tauri", branch = "qt-support" }
tauri-utils = { git = "https://github.com/KRTirtho/tauri", branch = "qt-support" }
tauri-macros = { git = "https://github.com/KRTirtho/tauri", branch = "qt-support" }
tauri-codegen = { git = "https://github.com/KRTirtho/tauri", branch = "qt-support" }
tauri-build = { git = "https://github.com/KRTirtho/tauri", branch = "qt-support" }
muda = { git = "https://github.com/KRTirtho/muda", branch = "qt-backend" }

# muda takes qtshim from this repository on GitHub: here it is this workspace's own (one `qtshim` native library).
[patch."https://github.com/KRTirtho/tauri-runtime-qt"]
qtshim = { path = "crates/qtshim" }
qtshim-sys = { path = "crates/qtshim-sys" }
qt-test-harness = { path = "crates/qt-test-harness" }
